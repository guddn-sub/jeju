<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울시 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{height:100%;margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  #map{height:100%}
  .title{position:absolute;top:12px;left:50px;z-index:1000;background:#fff;padding:6px 14px;border-radius:999px;font-weight:700;box-shadow:0 2px 8px #0003}
</style>
</head>
<body>
  <div class="title">서울시 지도</div>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const map = L.map('map').setView([37.5665, 126.9780], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    [
      ['서울시청', 37.5663, 126.9779],
      ['경복궁', 37.5796, 126.9770],
      ['N서울타워', 37.5512, 126.9882],
      ['여의도 한강공원', 37.5283, 126.9326],
      ['롯데월드타워', 37.5126, 127.1028]
    ].forEach(([n, la, lo]) => L.marker([la, lo]).addTo(map).bindPopup(n));
  </script>
</body>
</html>
